spring:

  docker:
    compose:
      enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb,DB_CLOSE_DELAY=1, MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: spring
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LXRlc3Qtc2VjcmV0LWtleS0zMmJ5dGVz
    expiration: 30m

  cors:
    allowed-origins: http://localhost:3000