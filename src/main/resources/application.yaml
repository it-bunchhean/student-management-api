server:
  port: ${SPRING_PORT:8080}
  servlet:
    context-path: /api/v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

app:
  cors:
    - allowed-origins: ${APP_ALLOWED_ORIGIN}

spring:
  application:
    name: student-management-system-api
  config:
    import:
      - optional:file:.env[.yaml]

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  signing:
    key: ${JWT_SIGNING_KEY}
    expiration: ${JWT_EXPIRATION_TIME}